<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f172a">
    <!--
      This page is the Admin Portal, not the Store Hub shop. It ships in its own
      directory, imports nothing from ../js, and is never linked from the
      customer application — see ADMIN_PORTAL.md.
    -->
    <meta name="robots" content="noindex, nofollow">
    <title>Store Hub — لوحة الإدارة</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="admin.css">
  </head>
  <body>
    <!--
      Everything is rendered by js/admin.js. The markup below is the shell only:
      no licence data, no customer data, and no navigation the backend has not
      already agreed to. If the script never runs, an operator sees a blank
      frame rather than a half-working console.
    -->
    <div id="root" aria-busy="true">
      <div class="centered-state">
        <div class="spinner" role="status" aria-label="جارٍ التحميل"></div>
      </div>
    </div>

    <div class="toast-container" id="toastContainer" role="status" aria-live="polite"></div>

    <div
      class="modal-overlay"
      id="modalOverlay"
      style="display: none"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modalTitle"
    >
      <div class="modal">
        <div class="modal-header">
          <h2 class="modal-title" id="modalTitle"></h2>
          <button class="modal-close" id="modalClose" type="button" aria-label="إغلاق">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <div id="modalBody"></div>
      </div>
    </div>

    <script type="module" src="admin.js"></script>
  </body>
</html>
